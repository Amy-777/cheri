<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- The base structural CSS (fonts, layout, generic component rules) always
     loads — it's what makes every template's markup actually work. Each
     template then loads on top of it as an additive skin (colors, card
     styling, decorative touches), swapped at runtime based on the cafe's
     chosen template — see loadMenu() below, which sets this link's href
     once it knows which one to use. -->
<link rel="stylesheet" href="templates/default.css">
<!-- The template skin loads as an ADDITIONAL layer on top of default.css
     above, never replacing it — default.css owns all structural layout
     (spacing, cards, grid); a template only adds color/decoration on top.
     Empty href = no extra skin (plain default look). -->
<link id="template-skin-css" rel="stylesheet" href="">
<!-- The cafe's customizable About page: own engine + own stylesheet, independent of the menu template. -->
<link rel="stylesheet" href="about-page.css">
<script src="amenities.js"></script>
<script src="about-page.js"></script>
<script src="about-hotel.js" defer></script>
<script src="templates/theme-fx.js"></script>
<style id="room-css">
  /* ---- Hotel room page: one big Call Room Service button on top ---- */
  .room-call { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 14px; width: calc(100% - 32px); margin: 4px 16px 14px; padding: 18px 20px; border-radius: 20px;
    background: var(--olive, #171A21); color: var(--on-primary, #fff); box-shadow: 0 10px 28px rgba(0,0,0,.18); -webkit-tap-highlight-color: transparent; transition: transform .12s ease, opacity .12s ease; }
  .room-call:active { transform: scale(.98); opacity: .92; }
  .room-call:disabled { opacity: .75; cursor: default; }
  .room-call.sent { background: #1E8E3E; color: #fff; }
  .room-call .rc-ic { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; }
  .room-call .rc-txt { display: flex; flex-direction: column; gap: 3px; text-align: left; }
  .room-call .rc-main { font: 800 19px/1.15 var(--font-head, 'Space Grotesk', sans-serif); letter-spacing: .01em; }
  .room-call .rc-sub { font-size: 12.5px; opacity: .85; }
  .room-note { margin: 0 16px 16px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--glass-line, var(--border)); background: var(--glass, transparent); color: var(--text-secondary); font-size: 13.5px; line-height: 1.5; text-align: center; }
  body.is-room #call-btn { display: none; }
  body.no-dining .search-wrap, body.no-dining #category-scrollbar, body.no-dining #menu-wrap, body.no-dining #fb-menu-slot, body.no-dining #status-banner-slot,
  body.no-dining .panel-nav-dots, body.no-dining .bottom-bar, body.no-dining .menu-filters { display: none !important; }
</style>
<style>
  /* CATEGORY heading (above subcategories): bigger, bolder, centred between two rules */
  .menu-section { margin: 34px 0 6px; }
  .menu-section-title { display: flex; align-items: center; gap: 14px; margin: 0 0 18px; text-align: center;
    font-family: var(--font-head, serif); font-weight: 800; font-size: 28px; line-height: 1.15; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
  .menu-section-title span { flex: 0 1 auto; max-width: 78%; overflow-wrap: anywhere; }
  .menu-section-title::before, .menu-section-title::after { content: ""; flex: 1 1 0; height: 2px; min-width: 18px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--terracotta, currentColor)); opacity: .85; }
  .menu-section-title::after { background: linear-gradient(90deg, var(--terracotta, currentColor), transparent); }
  .category-block.untitled { margin-top: 4px; }
  .category-block.untitled:not(:first-child) { border-top: 1px dashed var(--glass-line, var(--border)); padding-top: 14px; }
</style>
<style>
  /* ---- Veg / non-veg marks, hot / cold, sizes ---- */
  .diet-mark { display: inline-grid; place-items: center; width: 13px; height: 13px; border: 1.5px solid currentColor; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: #fff; flex: 0 0 auto; }
  .diet-mark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .diet-mark.veg { color: #1E8E3E; } .diet-mark.egg { color: #C77700; }
  .diet-mark.nonveg { color: #B3261E; }
  .diet-mark.nonveg::after { border-radius: 0; width: 0; height: 0; background: none; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 7px solid currentColor; }
  .mi-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .mi-tag { font-size: 11px; font-weight: 600; line-height: 1; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--glass-line, var(--border)); color: var(--text-secondary); white-space: nowrap; }
  .mi-tag.hot { color: #C2410C; color: color-mix(in srgb, #EA580C 55%, var(--ink)); border-color: rgba(194,65,12,.35); } .mi-tag.cold { color: #0369A1; color: color-mix(in srgb, #0284C7 55%, var(--ink)); border-color: rgba(3,105,161,.35); }
  .mi-tag.meat { color: #9F1239; color: color-mix(in srgb, #E11D48 50%, var(--ink)); border-color: rgba(225,29,72,.4); }
  #vp-backdrop { z-index: 90; }
  /* filter chips under the search bar */
  .menu-filters { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .menu-filters::-webkit-scrollbar { display: none; }
  .mf-chip { all: unset; cursor: pointer; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; font: 600 12.5px/1 var(--font-body, sans-serif);
    color: var(--ink); background: var(--glass, var(--paper)); border: 1px solid var(--glass-line, var(--border)); -webkit-tap-highlight-color: transparent; }
  .mf-chip[aria-pressed="true"] { background: var(--olive); border-color: var(--olive); color: var(--on-primary, #fff); }
  .mf-chip[aria-pressed="true"] .diet-mark { background: #fff; }
  .mf-sub { padding-top: 4px; }
  .mf-sub .mf-chip { font-size: 12px; padding: 6px 10px; }
  /* size / hot-cold picker */
  .vp-sec { margin: 4px 0 16px; }
  .vp-q { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }
  .vp-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .vp-opt { all: unset; cursor: pointer; padding: 11px 15px; border-radius: 14px; border: 1.5px solid var(--glass-line, var(--border)); color: var(--ink); font-weight: 600; font-size: 14px; display: flex; flex-direction: column; gap: 3px; min-width: 64px; text-align: center; }
  .vp-opt small { font-weight: 500; color: var(--text-secondary); font-size: 12px; }
  .vp-opt[aria-pressed="true"] { border-color: var(--olive); box-shadow: inset 0 0 0 1px var(--olive); background: var(--olive-soft, transparent); }
  .vp-add { width: 100%; margin-top: 6px; }
</style>
<style id="bill-fx">
  #bill-ask { margin-top: 14px; }
  .bill-btn { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 16px; border-radius: 14px; border: 1.5px solid var(--ink, #171A21); background: transparent; color: var(--ink, #171A21); font: 700 14px 'Inter', sans-serif; cursor: pointer; transition: background .2s, color .2s, transform .15s; }
  .bill-btn:hover:not(:disabled) { background: var(--ink, #171A21); color: #fff; }
  .bill-btn:active:not(:disabled) { transform: scale(.98); }
  .bill-btn:disabled { opacity: .55; cursor: default; }
  .bill-hint { font-size: 11.5px; color: var(--text-secondary); text-align: center; margin-top: 7px; }
  .bill-ok { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--olive-soft, #E8F3E8); color: var(--olive-dark, #2F6B3A); font-size: 13px; line-height: 1.45; }
  .bill-ok b { display: block; font-size: 14px; }
  .bill-ok svg { flex: none; margin-top: 2px; }
</style>
<style id="fc-fx">
  /* ---- carousels: Today's Specials + Bestsellers ---- */
  .fc-wrap { margin: 6px 0 18px; }
  .fc-head { display: flex; align-items: center; gap: 10px; padding: 0 2px 10px; }
  .fc-head h2 { margin: 0; font-size: 20px; line-height: 1.2; }
  .fc-count { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: rgba(232,115,26,.14); color: #B65410; }
  .fc-track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; padding: 2px 2px 26px; margin: 0 -2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; touch-action: pan-x pan-y; }
  .fc-nav { display: none; }
  @media (hover: hover) and (pointer: fine) { .fc-wrap { position: relative; } .fc-nav { display: flex; position: absolute; top: 46%; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.95); color: #222; box-shadow: 0 2px 10px rgba(0,0,0,.25); align-items: center; justify-content: center; font-size: 20px; cursor: pointer; z-index: 3; } .fc-nav.l { left: 2px; } .fc-nav.r { right: 2px; } .fc-nav[hidden] { display: none; } }
  .fc-track::-webkit-scrollbar { display: none; }
  .fc-card { position: relative; flex: 0 0 min(44vw, 176px); scroll-snap-align: start; background: #fff; border-radius: 22px; padding: 8px 8px 12px; box-shadow: 0 6px 20px -10px rgba(0,0,0,.25); display: flex; flex-direction: column; }
  .fc-media { position: relative; width: 100%; aspect-ratio: 1 / 1; }          /* square tile; the ADD button hangs off its bottom edge */
  .fc-img { position: absolute; inset: 0; border-radius: 16px; overflow: hidden; background: linear-gradient(135deg, #F3D9C4, #E9B98F); display: flex; align-items: center; justify-content: center; font: 700 44px/1 'Playfair Display', serif; color: rgba(255,255,255,.9); }
  .fc-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .fc-img .mi-slide { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 0; background: transparent; }
  .fc-noimg { align-self: flex-start; }
  .fc-noimg .fc-body { padding-top: 8px; }
  .fc-noimg .fc-price { margin-top: 0; }
  .fc-noimg .fc-add { position: static; transform: none; align-self: flex-start; margin-top: 6px; }
  .fc-add { position: absolute; left: 50%; bottom: -19px; transform: translateX(-50%); z-index: 2; display: flex; align-items: center; justify-content: center; min-width: 84px; height: 38px; border-radius: 12px; border: 1.5px solid #E8731A; background: #fff; color: #C95A0B; font: 800 14px 'Inter', sans-serif; letter-spacing: .05em; cursor: pointer; box-shadow: 0 5px 12px -5px rgba(0,0,0,.35); padding: 0; }
  .fc-add button { all: unset; cursor: pointer; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; }
  .fc-add .q { min-width: 18px; text-align: center; }
  .fc-body { padding: 28px 6px 0; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .fc-name { margin: 0; font: 700 15px/1.25 'Inter', sans-serif; color: #1a1d24; }
  .fc-price { margin-top: auto; font: 500 13px 'Inter', sans-serif; color: #6B7280; }
  .fc-price b { font-weight: 700; color: #1a1d24; font-size: 15px; }
</style>
</head>
<body>

<div id="pre-loading" class="loading">Loading menu…</div>
<div id="error-state" class="error-state" style="display:none;"></div>

<!-- ==== Cover card → flip → swipeable menu ====
     On load we fetch the cafe's data, populate BOTH faces (the title-card
     cover AND the menu behind it) while everything is still invisible,
     then reveal the cover, hold it for ~1.4s, and 3D-flip the whole stage
     to land on the menu. Nothing here is template-specific — it uses the
     same default.css tokens (fonts/colors) as the rest of the menu, so a
     cafe's chosen template still applies once flipped in. -->
<div class="flip-stage" id="flip-stage" style="display:none;">
  <div class="flipper" id="flipper">

    <!-- FRONT: title card -->
    <div class="cover-face" id="cover-face">
      <div class="cover-border">
        <div class="cover-cafe-name" id="cover-cafe-name">—</div>
        <h1 class="cover-menu-word">Menu</h1>
        <div class="cover-illustration">
          <svg viewBox="0 0 100 84" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 78 Q50 88 94 78"/>
            <path d="M13 78 L18 54 Q50 60 82 54 L87 78"/>
            <rect x="22" y="32" width="11" height="22" rx="1.5"/>
            <rect x="42" y="24" width="9" height="30" rx="2"/>
            <path d="M44.5 24 V15 Q44.5 11 46.5 11 Q48.5 11 48.5 15 V24"/>
            <path d="M60 42 L65 54 L73 54 L78 42 Z"/>
            <line x1="69" y1="54" x2="69" y2="61"/>
            <line x1="64" y1="61" x2="74" y2="61"/>
          </svg>
        </div>
        <div class="cover-meta">
          <div class="cover-hours" id="cover-hours"></div>
          <div class="cover-address" id="cover-address"></div>
        </div>
      </div>
    </div>

    <!-- BACK: the actual app (order page ← menu → about, swipeable) -->
    <div class="app-face" id="app-face">

      <div class="carousel" id="carousel">
        <div class="carousel-track" id="carousel-track">

          <!-- Swipe RIGHT from the menu lands here: order details + total + payment QR -->
          <section class="carousel-panel side-page" id="panel-order">
            <h2 class="side-page-title">Your Order</h2>
            <p class="side-page-sub">Review your order, then pay using the QR below or ask your waiter.</p>

            <div id="order-history-wrap" style="display:none; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--border);">
              <div style="font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-secondary); margin-bottom:8px;">Ordered so far</div>
              <div id="order-history-lines"></div>
              <div style="display:flex; justify-content:space-between; font-weight:700; font-size:14px; padding-top:8px; margin-top:4px; border-top:1px dashed var(--border);"><span>Subtotal</span><span id="order-history-total-amt">₹0</span></div>
              <div id="bill-ask"></div>
            </div>

            <div class="order-page-lines" id="order-page-lines"></div>
            <div class="order-page-total"><span>Total</span><span id="order-page-total-amt">₹0</span></div>
            <label class="note-label" for="order-note">Message for the waiter (optional)</label>
            <textarea id="order-note" class="note-input" rows="2" placeholder="e.g. less sugar, no onions…"></textarea>
            <button class="place-order-btn" id="place-order-btn" onclick="placeOrder()">Confirm order</button>
            <div class="order-qr-wrap" id="order-qr-wrap" style="display:none;">
              <img id="order-qr-img" src="" alt="Payment QR code">
              <div class="order-qr-note">Scan to pay — show your confirmation to the waiter.</div>
            </div>
            <div id="fb-order-slot"></div>
          </section>

          <!-- Default view -->
          <section class="carousel-panel panel-menu" id="panel-menu">
            <header>
              <div class="header-top">
                <img id="cafe-logo" class="header-mark" style="display:none;" alt="">
                <div id="cafe-logo-fallback" class="header-mark">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
                </div>
                <button class="bell-btn" id="bell-btn" onclick="toggleNotifications()" aria-label="Notifications">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="19" height="19"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                  <span class="bell-badge" id="bell-badge"></span>
                </button>
              </div>
              <div class="header-center">
                <h1 id="cafe-name">—</h1>
                <div class="header-subtitle">Café &amp; Kitchen</div>
                <div class="table-chip" id="table-chip"></div>
              </div>
            </header>

            <div class="search-wrap">
              <div class="search-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input id="search-input" type="text" placeholder="Search menu" oninput="onSearchInput()">
                <button class="search-clear" id="search-clear" onclick="clearSearch()" aria-label="Clear search">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
              </div>
            </div>

            <div id="status-banner-slot"></div>

            <div class="category-scrollbar" id="category-scrollbar"></div>

            <div class="menu-wrap" id="menu-wrap"></div>
            <div id="fb-menu-slot"></div>
          </section>

          <!-- Swipe LEFT from the menu lands here: the cafe's about section -->
          <section class="carousel-panel side-page" id="panel-about">
            <h2 class="side-page-title">About</h2>
            <p class="side-page-sub" id="about-cafe-name"></p>
            <div id="panel-about-body"></div>
          </section>

        </div>
      </div>

      <div class="panel-nav-dots" id="panel-nav-dots">
        <span onclick="goToPanel(0)" aria-label="Order"></span>
        <span class="active" onclick="goToPanel(1)" aria-label="Menu"></span>
        <span onclick="goToPanel(2)" aria-label="About"></span>
      </div>

      <div class="bottom-bar">
        <button class="pill-btn call-pill" id="call-btn" onclick="ringWaiter()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span id="call-btn-label">Call Waiter</span>
        </button>
        <button class="pill-btn cart-pill" id="cart-btn" onclick="goToPanel(0)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 2-1.58l1.65-7.42H5.12"/></svg>
          <span>Your Order</span>
          <span class="cart-badge" id="cart-badge" style="display:none;"></span>
        </button>
      </div>

    </div>
  </div>
</div>

<div class="sheet-backdrop" id="notif-backdrop" onclick="if(event.target===this) closeNotifications()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-top-row">
      <h2>Notifications</h2>
      <button class="close-sheet" onclick="closeNotifications()" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div id="notif-lines"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==== Veg / non-veg, hot / cold, sizes ====
   Item fields from the dashboard: diet ('veg' | 'egg' | 'nonveg'), contains (['Chicken','Fish',…]),
   temps (['hot','cold']), sizes ([{name:'Small', price:120}, …]). Items with more than one
   size, or offered both hot and cold, open a small picker when added; each choice is its own
   line in the order ("Cold Coffee · Large · Cold"). */
// The backend may hand these back as arrays, JSON strings or "a, b" text — accept all three.
function asList(v) {
  if (Array.isArray(v)) return v;
  if (typeof v === 'string' && v.trim()) { try { const j = JSON.parse(v); if (Array.isArray(j)) return j; } catch (e) {} return v.split(',').map(x => x.trim()).filter(Boolean); }
  return [];
}
const itemSizes = i => asList(i.sizes).map(s => typeof s === 'string' ? { name: s, price: null } : s).filter(s => s && s.name);
const itemTemps = i => asList(i.temps).map(t => String(t).toLowerCase()).filter(t => t === 'hot' || t === 'cold');
const itemContains = i => asList(i.contains).map(String).filter(Boolean);
const itemKinds = i => asList(i.kinds).map(k => typeof k === 'string' ? { name: k, price: null, mark: null } : k).filter(k => k && k.name);
const itemTempPrices = i => (i && i.temp_prices && typeof i.temp_prices === 'object') ? i.temp_prices : {};
const itemCombos = i => (i && i.combo_prices && typeof i.combo_prices === 'object') ? i.combo_prices : {};
const numOrNull = v => (v != null && v !== '' && isFinite(Number(v))) ? Number(v) : null;
// How many of the three groups (type / size / hot-cold) a guest has to choose from.
const groupsInUse = i => [itemKinds(i), itemSizes(i), itemTemps(i)].filter(g => g.length > 1).length;
/* Add-ons: optional extras the cafe set up for a dish (item.addons = [{name, price}]). A guest can tick any number of
   them; each is priced on top of the dish, and the order carries their names (items[].addons) for the server to price. */
const itemAddons = i => asList(i && i.addons).map(a => typeof a === 'string' ? { name: a, price: 0 } : a).filter(a => a && a.name).map(a => ({ name: String(a.name), price: Number(a.price) || 0 }));
const addonSum = list => (list || []).reduce((t, a) => t + (Number(a && a.price) || 0), 0);
const addonNamesOf = i => asList(i && i.addons).map(a => typeof a === 'string' ? a : (a && a.name)).filter(Boolean).map(String);
const hasChoice = i => groupsInUse(i) > 0 || itemAddons(i).length > 0;
const comboKey = (k, s, t) => [k, s, t].map(x => String(x || '').trim().toLowerCase()).join('|');
const kindMark = name => /^veg(etarian)?$/i.test(String(name).trim()) ? 'veg' : /^egg/i.test(String(name).trim()) ? 'egg' : 'nonveg';
// The price of ONE specific choice — the same rule the server applies when the order arrives: one group in use ->

<script id="gallery-js">
/* One photo for the dish, plus one per Type / Size the cafe photographed. The list tile cycles through them

  const out = [], seen = new Set();
  const add = (src, label) => { if (src && !seen.has(src)) { seen.add(src); out.push({ src, label: label || '' }); } };
  add(item.photo_url, '');

const galName = item => item.is_secret && typeof maskName === 'function' ? maskName(item.name) : item.name;

  w = w || 240;

  return `<button type="button" class="mi-slide" data-slide="${item.id}" data-n="${frames.length}" aria-label="Photos of ${escapeHtml(galName(item))}">
    ${frames.map((f, i) => `<img alt="" decoding="async" draggable="false" ${i === 0 ? `src="${escapeHtml(galThumb(f.src, w))}" class="on"` : `data-src="${escapeHtml(galThumb(f.src, w))}"`} data-label="${escapeHtml(f.label)}">`).join('')}

    <span class="ms-tag ${frames[0].label && multi ? 'on' : ''}">${escapeHtml(multi ? frames[0].label : '')}</span>
  </button>`;
}

/* ---- list slideshow: one timer for the whole page ---- */
const GalSlides = (() => {

  function show(el, to) {
    const imgs = el.querySelectorAll('img'), s = st(el);
    const img = imgs[to]; if (!img) return;
    const apply = () => {
      imgs.forEach((m, k) => m.classList.toggle('on', k === to));
      el.querySelectorAll('.ms-dots i').forEach((d, k) => d.classList.toggle('on', k === to));
      const tag = el.querySelector('.ms-tag'); if (tag) { const lab = img.dataset.label || ''; tag.textContent = lab; tag.classList.toggle('on', !!lab); }

  function scan(root) {

        el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') st(el).hold = true; });
        el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { const s = st(el); s.hold = false; s.at = Date.now() + 1500; } });
        el.addEventListener('touchstart', () => { const s = st(el); s.hold = true; }, { passive: true });
        const rel = () => { const s = st(el); s.hold = false; s.at = Date.now() + 2000; };
        el.addEventListener('touchend', rel, { passive: true }); el.addEventListener('touchcancel', rel, { passive: true });
      }
    });
  }
  if (!reduce) setInterval(tick, 400);
  setInterval(() => scan(), 700);
  return { scan, index: el => st(el).i };
})();

/* ---- the photo card ---- */
const PV = (() => {
  let el, track, dots, cap, frames = [], idx = 0, timer = 0, hold = false, resumeAt = 0, itemRef = null;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function build() {
    el = document.createElement('div'); el.id = 'pv'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
    el.innerHTML = `<div class="pv-card"><div class="pv-stage">
        <div class="pv-track" id="pv-track"></div>
        <button type="button" class="pv-x" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        <button type="button" class="pv-arrow l" aria-label="Previous photo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <button type="button" class="pv-arrow r" aria-label="Next photo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
        <div class="pv-dots" id="pv-dots"></div></div>
      <div class="pv-cap"><b id="pv-name"></b><span id="pv-lab"></span></div></div>`;
    document.body.appendChild(el);
    track = el.querySelector('#pv-track'); dots = el.querySelector('#pv-dots');
    el.addEventListener('click', e => { if (e.target === el || e.target.closest('.pv-x')) close(); });
    el.querySelector('.pv-arrow.l').addEventListener('click', () => go(idx - 1));
    el.querySelector('.pv-arrow.r').addEventListener('click', () => go(idx + 1));
    dots.addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) go(Number(b.dataset.i)); });
    let raf = 0;
    track.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { const i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth)); if (i !== idx) mark(i); }); }, { passive: true });
    const pause = () => { hold = true; }, rel = () => { hold = false; resumeAt = Date.now() + 3500; };
    el.querySelector('.pv-stage').addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') pause(); });
    el.querySelector('.pv-stage').addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') rel(); });
    track.addEventListener('touchstart', pause, { passive: true }); track.addEventListener('touchend', rel, { passive: true }); track.addEventListener('touchcancel', rel, { passive: true });
  }
  function mark(i) {
    idx = i;
    dots.querySelectorAll('button').forEach((d, k) => d.classList.toggle('on', k === i));
    const f = frames[i]; el.querySelector('#pv-lab').textContent = f ? f.label : '';
    const nx = track.children[i + 1]; if (nx) { const im = nx.querySelector('img'); if (im && !im.getAttribute('src')) im.src = im.dataset.src; }
  }
  function go(i) {
    const n = frames.length; if (n < 2) return;
    i = (i + n) % n;
    track.style.scrollBehavior = (i === 0 && idx === n - 1) || reduce ? 'auto' : 'smooth';   // wrapping round jumps back instead of racing across
    track.scrollTo({ left: i * track.clientWidth });
    mark(i);
  }
  function open(item, start, list) {
    frames = list || itemFrames(item); if (!frames.length) return;
    itemRef = item; if (!el) build();
    const multi = frames.length > 1;
    track.classList.toggle('single', !multi); el.querySelector('.pv-card').classList.toggle('multi', multi);
    track.innerHTML = frames.map((f, i) => `<div class="pv-slide"><img alt="" decoding="async" draggable="false" ${Math.abs(i - start) <= 1 ? `src="${escapeHtml(galThumb(f.src, 720))}"` : `data-src="${escapeHtml(galThumb(f.src, 720))}"`}></div>`).join('');
    track.querySelectorAll('img').forEach(im => { im.onerror = () => { im.style.visibility = 'hidden'; }; });
    dots.innerHTML = multi ? frames.map((_, i) => `<button type="button" data-i="${i}" aria-label="Photo ${i + 1} of ${frames.length}"></button>`).join('') : '';
    el.querySelector('#pv-name').textContent = galName(item);
    el.setAttribute('aria-label', 'Photos of ' + galName(item));
    el.classList.add('show'); document.body.classList.add('pv-lock');
    start = Math.min(Math.max(0, start || 0), frames.length - 1);
    track.style.scrollBehavior = 'auto'; track.scrollLeft = start * track.clientWidth; idx = start; mark(start);
    requestAnimationFrame(() => { track.scrollLeft = start * track.clientWidth; el.classList.add('in'); });
    clearInterval(timer); hold = false; resumeAt = Date.now() + 2500;
    if (multi && !reduce) timer = setInterval(() => { if (!hold && Date.now() > resumeAt && !document.hidden) go(idx + 1); }, 3500);
    el.querySelector('.pv-x').focus({ preventScroll: true });
  }
  function close() {
    if (!el || !el.classList.contains('show')) return;
    clearInterval(timer); el.classList.remove('in'); document.body.classList.remove('pv-lock');
    setTimeout(() => { if (!el.classList.contains('in')) el.classList.remove('show'); }, 230);
  }
  const isOpen = () => !!el && el.classList.contains('show') && el.classList.contains('in');
  window.addEventListener('keydown', e => {
    if (!isOpen()) return;
    if (e.key === 'Escape') { e.stopImmediatePropagation(); close(); }
    else if (e.key === 'ArrowRight') go(idx + 1); else if (e.key === 'ArrowLeft') go(idx - 1);
  }, true);
  return { open, close };
})();
document.addEventListener('click', e => {
  const t = e.target.closest('.mi-slide'); if (t) {
    const item = (typeof menu !== 'undefined' ? menu : []).find(i => String(i.id) === t.dataset.slide); if (!item) return;
    PV.open(item, GalSlides.index(t)); return;
  }
  const h = e.target.closest('[data-pv-hero]'); if (h && typeof vpState !== 'undefined' && vpState) {
    const fr = itemFrames(vpState.item), at = Math.max(0, fr.findIndex(f => f.src === h.dataset.pvHero));
    PV.open(vpState.item, at, fr);
  }
});
</script>

<script>
const API_BASE = "https://xyzzy-backend.onrender.com";

const params = new URLSearchParams(location.search);
const qrToken = params.get('token');

let cafeInfo = null, tableInfo = null, menu = [];
let cart = {}; // cart key (item id, or id|size|temp) -> {menu_item_id, size, temperature, name, price, quantity}
let orderHistory = []; // this table's currently-open (unbilled) orders — the running tab, separate from the draft cart
let pendingOrders = []; // orders the customer has confirmed that are still being sent — shown at once as "Sending…"
let retryToken = null, retrySig = ''; // if a send fails, re-confirming the SAME cart re-uses its token, so a retry can never order twice
let searchQuery = '';

/* ---- Notifications (built on events this page can genuinely observe: an
   order placed, a waiter called. There is currently no customer-facing
   endpoint to poll live order-status transitions (preparing/served/paid) —
   see notifyOrderStatus() below, which is a ready-made hook for that once
   such an endpoint or a push subscription exists, so nothing here needs to
   change except wiring the source in. ) ---- */
let notifications = [];
let unreadCount = 0;

function addNotification(title, message) {
  notifications.unshift({ title, message, time: new Date(), read: false });
  unreadCount++;
  updateBellBadge();
}
// Hook for future order-status push/poll integration — intentionally unused
// for now since no such endpoint exists yet; wire a real source in here.
function notifyOrderStatus(status) {
  const copy = { preparing: 'Your order is being prepared.', served: 'Your order has been served.', paid: 'Order completed — thanks for visiting!' };
  if (copy[status]) addNotification('Order update', copy[status]);
}
function updateBellBadge() {
  const badge = document.getElementById('bell-badge');
  badge.classList.toggle('show', unreadCount > 0);
}
function formatNotifTime(d) {
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}
function renderNotifications() {
  const wrap = document.getElementById('notif-lines');
  if (!notifications.length) {
    wrap.innerHTML = '<div class="sheet-empty">Nothing yet — updates about your order and waiter calls will show up here.</div>';
    return;
  }
  wrap.innerHTML = '';
  notifications.forEach(n => {
    const row = document.createElement('div');
    row.className = 'notif-item' + (n.read ? ' read' : '');
    row.innerHTML = `<div class="notif-dot"></div>
      <div><p class="notif-title">${escapeHtml(n.title)}</p><p class="notif-msg">${escapeHtml(n.message)}</p><div class="notif-time">${formatNotifTime(n.time)}</div></div>`;
    wrap.appendChild(row);
  });
}
function toggleNotifications() {
  renderNotifications();
  document.getElementById('notif-backdrop').classList.add('show');
  notifications.forEach(n => n.read = true);
  unreadCount = 0;
  updateBellBadge();
}
function closeNotifications() { document.getElementById('notif-backdrop').classList.remove('show'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

// ---- Location: verified once (high-accuracy GPS only, no cell-tower
// fallback — precision matters more than success rate here), then reused
// for LOCATION_CACHE_MINUTES so repeat calls/orders from the SAME device on
// THIS table don't re-prompt every time. Deliberately stored per-table
// (keyed by this table's own QR token) rather than a blanket "don't check
// this table for X minutes" — otherwise anyone who ever got hold of the
// link (a screenshot, a forward) would skip verification too, not just the
// person who actually verified.
const LOCATION_TIMEOUT_MS = 10000;
const LOCATION_CACHE_MINUTES = 10;
const LOCATION_STATUS_MESSAGES = ['Checking your location…', 'Confirming your table…', 'Almost there…'];
const LOCATION_CACHE_KEY = qrToken ? `xyzzy_loc_${qrToken}` : null;

let locationPromise = null;     // in-flight fetch, if one's currently running

function readLocationCache() {
  if (!LOCATION_CACHE_KEY) return null;
  try {
    const raw = localStorage.getItem(LOCATION_CACHE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Date.now() - parsed.cachedAt > LOCATION_CACHE_MINUTES * 60 * 1000) return null; // stale
    return parsed;
  } catch (e) { return null; }
}
function writeLocationCache(result) {
  if (!LOCATION_CACHE_KEY) return;
  try {
    localStorage.setItem(LOCATION_CACHE_KEY, JSON.stringify({ ...result, cachedAt: Date.now() }));
  } catch (e) { /* localStorage unavailable (private mode etc.) — just skip caching, not fatal */ }
}

function fetchLocationOnce() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: LOCATION_TIMEOUT_MS, maximumAge: 0 }
    );
  });
}

function cacheIsFresh() {
  return !!readLocationCache();
}

// What callers actually use — reuses a fresh cached verification instantly
// (no GPS call at all) if this same device verified for this same table
// within the last LOCATION_CACHE_MINUTES. Otherwise does one fresh check,
// capped at LOCATION_TIMEOUT_MS — if that fails or times out, the call/order
// still goes through, just unverified (the backend's spam guard is what
// actually catches a pattern of repeated unverified attempts, not this).
// A failed check is never cached, so the next tap tries again fresh rather
// than being stuck "unverified" for the full window over a one-off hiccup.
function getLocation() {
  const cached = readLocationCache();
  if (cached) return Promise.resolve(cached);
  if (locationPromise) return locationPromise; // a check is already in flight — share it, don't start a second one

  locationPromise = (async () => {
    const result = await fetchLocationOnce();
    locationPromise = null;
    if (result) { writeLocationCache(result); return result; }
    return { lat: null, lng: null, accuracy: null }; // consistent shape either way
  })();
  return locationPromise;
}

// Shows a cycling status message on a button ONLY while a real GPS check is
// actually in flight — if a fresh cached location is already sitting ready
// (the common case for repeat taps within the cache window), this does
// nothing and the tap is instant.
async function withLocationStatus(button, fn) {
  let interval = null;
  if (!cacheIsFresh()) {
    let i = 0;
    button.textContent = LOCATION_STATUS_MESSAGES[0];
    interval = setInterval(() => {
      i = (i + 1) % LOCATION_STATUS_MESSAGES.length;
      button.textContent = LOCATION_STATUS_MESSAGES[i];
    }, 900);
  }
  try {
    return await fn();
  } finally {
    if (interval) clearInterval(interval);
  }
}

// ---- Menu templates ----
// window.templateHooks lets a template's JS react to things happening in
// the shared engine (e.g. "an item was just added to the cart") without the
// engine needing to know anything about any specific template. Every hook
// defaults to a no-op, so a template that doesn't define one just does
// nothing extra — never an error.
window.templateHooks = {
  onAddToCart(buttonEl) {},
};

function applyTemplate(templateId) {
  // Only plain ids ever reach a file path (templates/<id>.css|js).
  const id = /^[a-z0-9_-]{1,30}$/.test(templateId || '') ? templateId : 'default';
  const link = document.getElementById('template-skin-css');
  window.templateHooks = { onAddToCart(buttonEl) {} }; // reset to no-ops before loading the new one in
  if (window.ThemeFX) ThemeFX.stop();                  // a previous theme's animated background, if any
  document.documentElement.dataset.theme = id;
  const existing = document.getElementById('template-js');
  if (existing) existing.remove();
  if (id === 'default') { link.href = ''; return Promise.resolve(); }   // default.css alone is the whole look

  // Resolves once the skin (and the fonts it @imports) has loaded — so the cover never flashes the wrong look.
  const skinLoaded = new Promise(resolve => { link.onload = link.onerror = () => resolve(); setTimeout(resolve, 2500); });
  link.href = `templates/${id}.css`;
  const script = document.createElement('script');
  script.id = 'template-js';
  script.src = `templates/${id}.js`;
  document.body.appendChild(script);
  return skinLoaded;
}

/* Owner-only preview: order.html?token=…&theme=royal&preview=1 shows a theme without saving it. */
const PREVIEW_THEME = (params.get('preview') === '1' && /^[a-z0-9_-]{1,30}$/.test(params.get('theme') || '')) ? params.get('theme') : '';
function showPreviewBadge() {
  if (!PREVIEW_THEME) return;
  const b = document.createElement('div');
  b.textContent = '👁 Previewing the “' + PREVIEW_THEME + '” theme — not saved (tap to hide)';
  b.style.cssText = 'position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99999;background:rgba(20,20,24,.86);color:#fff;font:600 11.5px/1.3 system-ui,sans-serif;padding:8px 14px;border-radius:99px;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer';
  b.onclick = () => b.remove();
  document.body.appendChild(b);
}

/* ==== Cover card + flip-in reveal ====
   Populates the title card with THIS cafe's name (and hours/address if the
   cafe has set them), shows it, holds for ~1.4s, then flips the whole stage
   to land on the menu (which was rendered underneath while the cover was
   showing, so there's no pop-in once flipped). */
const COVER_HOLD_MS = 650;

function showCoverThenFlip() {
  document.getElementById('cover-cafe-name').textContent = cafeInfo.name || 'Menu';
  document.getElementById('cover-hours').textContent = cafeInfo.hours_text || '';
  document.getElementById('cover-address').textContent = cafeInfo.address_text || cafeInfo.address || '';

  document.getElementById('pre-loading').style.display = 'none';
  const stage = document.getElementById('flip-stage');
  stage.style.display = 'block';

  // Carousel math needs real dimensions, which only exist once the stage is visible.
  updateTrackPosition(0, false);

  // Force layout so the theme's fonts start loading, then reveal once they're in (max 1s).
  void stage.offsetHeight;
  const fontsReady = (document.fonts && document.fonts.ready)
    ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1000))]) : Promise.resolve();
  fontsReady.then(() => {
    requestAnimationFrame(() => document.getElementById('cover-face').classList.add('show'));
    setTimeout(() => {
      const flipper = document.getElementById('flipper');
      flipper.classList.add('flipped');
      setTimeout(() => flipper.classList.add('settled'), 700);   // flip is .55s — see .flipper.settled in default.css
    }, COVER_HOLD_MS);
  });
}

async function loadMenu() {
  if (!qrToken) {
    document.getElementById('pre-loading').style.display = 'none';
    document.getElementById('error-state').style.display = 'block';
    document.getElementById('error-state').textContent = 'No table code found — please rescan the QR on your table.';
    return;
  }
  try {
    const res = await fetch(`${API_BASE}/order/${qrToken}`);
    if (!res.ok) throw new Error((await res.json()).detail || 'Table not found');
    const data = await res.json();
    cafeInfo = data.cafe; tableInfo = data.table; menu = data.menu; bestsellerData = data.bestsellers || (data.cafe && data.cafe.bestsellers) || null;
    // Hotels can keep two menus: items marked "dine" are for the restaurant tables only, "room" only for hotel guests ordering from their room QR.
    { const inRoom = !!(tableInfo && tableInfo.is_room); menu = (menu || []).filter(i => !i.menu_for || i.menu_for === 'all' || i.menu_for === (inRoom ? 'room' : 'dine')); }

    document.getElementById('cafe-name').textContent = cafeInfo.name;
    document.getElementById('table-chip').textContent = tableInfo.label || (tableInfo.name || (/^\d+[A-Za-z]?$/.test(String(tableInfo.table_number).trim()) ? 'Table ' + String(tableInfo.table_number).trim() : String(tableInfo.table_number).trim()));
    if (cafeInfo.logo_url) {
      const logoEl = document.getElementById('cafe-logo');
      logoEl.src = cafeInfo.logo_url;
      logoEl.style.display = 'block';
      document.getElementById('cafe-logo-fallback').style.display = 'none';
    }
    await applyTemplate(PREVIEW_THEME || cafeInfo.menu_template);
    if (!cafeInfo.theme_effects_enabled) {
      if (window.ThemeFX) ThemeFX.stop();          // stop the ambient background
      window.templateHooks = { onAddToCart() {} };  // no burst on add-to-cart
    }
    showPreviewBadge();
    applyRoomMode();
    renderMenu();
    renderOrderPanel();
    renderAboutPanel();

    const aboutDot = document.querySelector('#panel-nav-dots span[aria-label="About"]');
    if (aboutDot) aboutDot.style.display = cafeInfo.about_enabled ? '' : 'none';

    showCoverThenFlip();
    if (location.hash === '#about' && cafeInfo.about_enabled) { currentPanel = 2; updateTrackPosition(0, false); updateDots(); renderAboutPanel(); }

    fetchOrderHistory();
    setInterval(fetchOrderHistory, 4000);
  } catch (e) {
    document.getElementById('pre-loading').style.display = 'none';
    document.getElementById('error-state').style.display = 'block';
    document.getElementById('error-state').textContent = e.message;
  }
}

/* ---- Search ---- */
function onSearchInput() {
  searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
  document.getElementById('search-clear').classList.toggle('show', searchQuery.length > 0);
  renderMenu();
}
function clearSearch() {
  document.getElementById('search-input').value = '';
  searchQuery = '';
  document.getElementById('search-clear').classList.remove('show');
  renderMenu();
}
function matchesSearch(item) {
  if (item.is_secret) return false;          // secret items live only on the hidden menu
  if (typeof matchesFilters === 'function' && !matchesFilters(item)) return false;
  if (!searchQuery) return true;
  const haystack = [item.name, item.description, item.category, item.section, itemContains(item).join(' '), itemTemps(item).join(' '), itemKinds(item).map(k => k.name).join(' '), item.diet === 'egg' ? 'egg' : '', item.diet === 'veg' ? 'veg' : item.diet ? 'non-veg nonveg' : ''].filter(Boolean).join(' ').toLowerCase();
  return haystack.includes(searchQuery);
}

/* ---- Category icon (presentational heuristic only — never affects data) ---- */
function categoryIcon(name) {
  const n = (name || '').toLowerCase();
  if (/(coffee|tea|beverage|drink|juice|shake)/.test(n)) {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>';
  }
  if (/(dessert|cake|sweet|pastry)/.test(n)) {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2 1 3.5 1 2-1 3.5-1 2 1 3.5 1 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3M12 8v3M17 8v3"/></svg>';
  }
  if (/(main|curry|rice|pizza|burger|noodle|pasta)/.test(n)) {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7a2 2 0 0 0 4 0V2"/><path d="M5 12v10"/><path d="M19 2v20"/><path d="M15 2v6a2 2 0 0 0 4 0V2"/></svg>';
  }
  return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>';
}

function qtyControlHtml(item, qty) {
  return `
    ${qty > 0 ? `<button class="qty-btn" onclick="changeQty(${item.id}, -1)" aria-label="Decrease"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button><span class="qty-num" id="qty-${item.id}">${qty}</span>` : ''}
    <button class="qty-btn primary" onclick="changeQty(${item.id}, 1, event)" aria-label="Add"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>`;
}
function renderMenuItemRow(item) {
  const qty = itemQtyInCart(item.id);
  const row = document.createElement('div');
  row.id = 'mi-row-' + item.id;
  row.className = 'menu-item' + (item.is_priority ? ' priority' : '');

  const frames = !cafeInfo.show_photos ? [] : itemFrames(item);     // the dish's photo + one per Type / Size that has its own
  const photoHtml = !cafeInfo.show_photos ? '' : (frames.length ? slideTileHtml(item, frames) : '');   // no photo → no photo card at all

  row.innerHTML = `
    ${photoHtml}
    <div class="mi-info">
      ${item.is_priority ? `<div class="priority-badge">Today's pick</div>` : ''}
      <div class="mi-top-row">
        <p class="mi-name">${dietMark(item)}${escapeHtml(item.name)}${item.unit ? ` <span class="mi-unit">(${escapeHtml(item.unit)})</span>` : ''}</p>
        <span class="mi-price">${priceLabel(item)}</span>
      </div>
      ${item.description ? `<p class="mi-desc">${escapeHtml(item.description)}</p>` : ''}

/* ==== Specials + Bestsellers carousels ====
   Specials  = the items the cafe marked "Today's pick" in the dashboard.
   Bestsellers = what actually sells. The numbers come from the same order history as the

   or a sold_count on each menu item. With too little history there is NO Bestsellers row —
   it only appears once at least BEST_MIN_ITEMS different dishes have each sold BEST_MIN_SOLD times. */
const BEST_MIN_SOLD = 3, BEST_MIN_ITEMS = 3, BEST_MAX = 10;

/* ---- "Your usual": the dishes this phone orders most at this cafe (kept in this browser only) ---- */

function renderMenu() {

    </div>`;

  }
  wrap.innerHTML = '';

  // Today's specials (the items marked "Today's pick") and, right below, the bestsellers — both as carousels at the top.
  // "Your usual": what this phone ordered here before (remembered on the phone only — no login, nothing sent anywhere).
  const usualItems = searchQuery ? [] : usualFor(visible);

  const bestItems = searchQuery ? [] : bestsellerItems(visible);
  if (bestItems.length) wrap.appendChild(featuredCarousel('Bestsellers', bestItems, 'cat-block-bestsellers'));

  // The rest: grouped by CATEGORY (item.section — big centred heading) and, inside it, by
  // subcategory (item.category — the usual heading), in the owner's chosen order. Either can be
  // left empty: no category → no big heading; no subcategory → items sit there with no heading

  const subOf = i => (i.category && i.category !== 'Uncategorized') ? i.category : '';
  const bySub = {};
  visible.forEach(item => { const c = subOf(item) || '\u0000'; (bySub[c] = bySub[c] || []).push(item); });
  const subOrder = orderedCategoryNames(bySub);
  if (subOrder.includes('\u0000')) subOrder.splice(subOrder.indexOf('\u0000'), 1), subOrder.unshift('\u0000');
  const sectionOrder = [];
  if (Array.isArray(cafeInfo.section_order)) cafeInfo.section_order.forEach(sname => { if (visible.some(i => (i.section || '') === sname)) sectionOrder.push(sname); });
  subOrder.forEach(c => bySub[c].forEach(i => { const k = i.section || ''; if (!sectionOrder.includes(k)) sectionOrder.push(k); }));

let categoryObserver = null;

function positionStickyBars() {
  // The chip bar stacks directly under the search bar — measured at
  // runtime rather than hardcoded, since the search bar's real height
  // shifts slightly with font rendering / whether the clear button shows.
  const searchWrap = document.querySelector('.search-wrap');
  const bar = document.getElementById('category-scrollbar');
  if (searchWrap && bar) bar.style.top = searchWrap.offsetHeight + 'px';
}

function renderCategoryBar(names) {
  const bar = document.getElementById('category-scrollbar');
  if (categoryObserver) { categoryObserver.disconnect(); categoryObserver = null; }

  // Redundant once a search has already narrowed things down to a
  // handful of results — the bar would mostly be jumping to sections
  // that aren't even showing.
  if (!names.length || searchQuery) { bar.style.display = 'none'; bar.innerHTML = ''; return; }

  bar.style.display = 'flex';
  const entry = n => typeof n === 'string' ? { name: n, slug: n === "Today's Picks" ? 'cat-block-priority' : categorySlug(n) } : n;
  bar.innerHTML = names.map(n => { const { name, slug } = entry(n);
    return `<button class="category-chip" data-target="${slug}" onclick="jumpToCategory('${slug}')">${escapeHtml(name)}</button>`;
  }).join('');

  positionStickyBars();

  // Scroll-spy: whichever section is currently occupying the band just
  // below the sticky bars gets its chip lifted, iOS-segmented-control style.
  const bar2 = document.getElementById('category-scrollbar');
  const topOffset = (document.querySelector('.search-wrap')?.offsetHeight || 0) + (bar2?.offsetHeight || 0);
  categoryObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const chip = bar.querySelector(`[data-target="${entry.target.id}"]`);
      if (!chip) return;
      bar.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      chip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    });
  }, { rootMargin: `-${topOffset + 4}px 0px -70% 0px`, threshold: 0 });

  names.forEach(n => {
    const { slug } = entry(n);
    const el = document.getElementById(slug);
    if (el) categoryObserver.observe(el);
  });
}

function jumpToCategory(slug) {
  const el = document.getElementById(slug);
  if (!el) return;
  const topOffset = (document.querySelector('.search-wrap')?.offsetHeight || 0) + (document.getElementById('category-scrollbar')?.offsetHeight || 0);
  const y = el.getBoundingClientRect().top + window.scrollY - topOffset - 8;
  window.scrollTo({ top: y, behavior: 'smooth' });
}

window.addEventListener('resize', positionStickyBars);

function changeQty(itemId, delta, event) {
  if (typeof itemId === 'string' && isNaN(Number(itemId))) return changeLineQty(itemId, delta);   // an order-page line
  itemId = Number(itemId);
  const item = menu.find(i => i.id === itemId);
  if (!item) return;
  if (delta > 0) {
    if (hasChoice(item)) return openVariantPicker(item, event && event.currentTarget);
    return addVariant(item, null, null, 1, event && event.currentTarget);
  }
  // − on a menu row: take one off the most recently added line for this item
  const keys = Object.keys(cart).filter(k => cart[k].menu_item_id === itemId);
  if (keys.length) changeLineQty(keys[keys.length - 1], -1);
}

/* ==== About panel (swipe LEFT from the menu) ====
   The cafe designs this page in the dashboard's About page studio; it arrives
   as cafeInfo.about_layout and is drawn by about-page.js (the same engine the
   studio's live preview uses). Cafes that haven't used the studio yet fall
   back to their old about_text + about_photos, laid out the same way. */
let aboutHtmlCache = '';
let aboutSettleTimer = null;
function renderAboutPanel() {
  const panel = document.getElementById('panel-about');
  const wrap = document.getElementById('panel-about-body');
  const layout = window.AboutPage ? AboutPage.resolve(cafeInfo) : null;

  if (layout) {
    panel.classList.add('ab-panel');
    panel.style.background = layout.style.bg;
    AboutPage.loadFonts(layout.style);
    const html = AboutPage.render(layout, cafeInfo, { preview: false });
    // Re-drawing on every swipe replays the entrance animation, but it would also wipe a half-filled
    // booking form — so if the page is unchanged and has a form, leave it exactly as the visitor left it.
    if (html === aboutHtmlCache && wrap.querySelector('.ab-book-form')) return;
    aboutHtmlCache = html;
    wrap.innerHTML = html;

    // Once the staggered entrance animation has genuinely finished, lock
    // every block into a plain static state (see .ab-settled in
    // about-page.css) — iOS Safari can otherwise re-rasterize a still-
    // "holding" transform/opacity animation mid-scroll and visibly replay
    // it, which is what was causing the flicker.
    clearTimeout(aboutSettleTimer);
    const blockCount = wrap.querySelectorAll('.ab-b').length;
    const settleDelay = blockCount * 70 + 700; // matches the CSS stagger (70ms/block) + animation duration, plus buffer
    aboutSettleTimer = setTimeout(() => {
      const abEl = wrap.querySelector('.ab');
      if (abEl) abEl.classList.add('ab-settled');
    }, settleDelay);
    return;
  }

  // Nothing designed and no legacy text/photos: the original friendly empty state.
  panel.classList.remove('ab-panel');
  panel.style.background = '';
  document.getElementById('about-cafe-name').textContent = cafeInfo.name || '';
  const contactLines = [];
  if (cafeInfo.address_text || cafeInfo.address) contactLines.push(escapeHtml(cafeInfo.address_text || cafeInfo.address));
  if (cafeInfo.phone) contactLines.push(escapeHtml(cafeInfo.phone));
  wrap.innerHTML = contactLines.length
    ? `<div class="about-block"><div class="about-label">Visit us</div><div class="about-text">${contactLines.join('<br>')}</div></div>`
    : '<div class="about-empty">This cafe hasn\'t added an About section yet.</div>';
}

/* ==== Swipeable carousel: Order ← Menu → About ====
   Panel 0 = Order, 1 = Menu (default/center), 2 = About. Swiping RIGHT
   (finger moves left→right) reveals the panel to the left (Order); swiping
   LEFT reveals the panel to the right (About) — same convention as any
   standard horizontal pager. */
let currentPanel = 1;
let dragStartX = 0, dragStartY = 0, dragDeltaX = 0, dragging = false;
let swipeAxis = null; // 'x' | 'y' | null — decided a few pixels into the gesture, not on the first touch event
const panelScrollY = {}; // each panel's own vertical scroll position, remembered across swipes

function maxPanel() {
  // No About panel at all when the cafe hasn't turned it on — swiping and
  // the nav dot both stop at Menu instead of revealing an empty page.
  return (cafeInfo && cafeInfo.about_enabled) ? 2 : 1;
}

function updateTrackPosition(extraPx, animate) {
  const carousel = document.getElementById('carousel');
  const track = document.getElementById('carousel-track');
  const w = carousel.clientWidth;
  track.classList.toggle('dragging', !animate);
  track.style.transform = `translateX(${-currentPanel * w + extraPx}px)`;
}

function updateDots() {
  document.querySelectorAll('#panel-nav-dots span').forEach((d, idx) => d.classList.toggle('active', idx === currentPanel));
}

function goToPanel(i) {
  panelScrollY[currentPanel] = window.scrollY; // remember where we're leaving this panel scrolled to
  currentPanel = Math.max(0, Math.min(maxPanel(), i));
  updateTrackPosition(0, true);
  updateDots();
  if (currentPanel === 0) renderOrderPanel();
  if (currentPanel === 2) renderAboutPanel();
  // Restore scroll only after the panel's own content is rebuilt above —
  // scrolling first can clamp to a shorter page (e.g. an empty cart) before
  // the real content fills in, and nothing scrolls further to catch up.
  window.scrollTo(0, panelScrollY[currentPanel] || 0);
}

function initCarouselSwipe() {
  const carousel = document.getElementById('carousel');
  const EDGE_MARGIN = 24; // px from either screen edge — leave this zone to the OS's own back-swipe gesture

  carousel.addEventListener('touchstart', e => {
    // A swipe that starts on a photo strip or the Specials/Bestsellers row scrolls the strip instead of flipping panels.
    if (e.target.closest && e.target.closest('.ab-gl-strip, .fc-track')) { dragging = false; return; }
    const x = e.touches[0].clientX;
    if (x < EDGE_MARGIN || x > window.innerWidth - EDGE_MARGIN) { dragging = false; return; }
    dragging = true;
    swipeAxis = null;
    dragStartX = x;
    dragStartY = e.touches[0].clientY;
  }, { passive: true });
  carousel.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dx = e.touches[0].clientX - dragStartX;
    const dy = e.touches[0].clientY - dragStartY;

    if (swipeAxis === null && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
      // Decide once, early, which direction this touch actually is — this
      // is what stops a plain vertical scroll from also nudging the
      // carousel sideways before it's clear what the person meant.
      swipeAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (swipeAxis === 'y') { dragging = false; return; } // hand it fully back to normal page scrolling
    }
    if (swipeAxis !== 'x') return;

    // Hard stop at either edge — no give at all — so a disabled panel (e.g.
    // About, when the cafe hasn't turned it on) never becomes even partly
    // visible mid-drag. A soft rubber-band would still leak a sliver through.
    const atLeftEdge = currentPanel === 0 && dx > 0;
    const atRightEdge = currentPanel === maxPanel() && dx < 0;
    dragDeltaX = (atLeftEdge || atRightEdge) ? 0 : dx;
    updateTrackPosition(dragDeltaX, false);
  }, { passive: true });
  carousel.addEventListener('touchend', () => {
    if (!dragging || swipeAxis !== 'x') { dragging = false; dragDeltaX = 0; return; }
    dragging = false;
    const threshold = carousel.clientWidth * 0.18;
    let target = currentPanel;
    if (dragDeltaX > threshold && currentPanel > 0) target--;
    else if (dragDeltaX < -threshold && currentPanel < maxPanel()) target++;
    dragDeltaX = 0;
    goToPanel(target);
  });
  window.addEventListener('resize', () => updateTrackPosition(0, false));
}

let CALL_TXT = { idle: 'Call Waiter', sent: 'Waiter Called', toast: 'The waiter has been notified', noteT: 'Waiter notified', noteB: 'Someone from the cafe is on the way to your table.' };

/* A hotel room's QR: the page opens with one big Call Room Service button (same call as the cafe's waiter call). */
function applyRoomMode() {
  if (!(tableInfo && tableInfo.is_room)) return;
  const dining = !!(cafeInfo && cafeInfo.room_dining);
  document.body.classList.add('is-room');
  if (!dining) document.body.classList.add('no-dining');
  CALL_TXT = { idle: 'Call Room Service', sent: 'Room Service Called', toast: 'Room service has been notified', noteT: 'Room service notified', noteB: 'Someone from the hotel team is on the way to your room.' };
  const sub = document.querySelector('.header-subtitle'); if (sub) sub.textContent = dining ? 'Room service & in-room dining' : 'Room service';
  const lbl = document.querySelector('label.note-label'); if (lbl) lbl.textContent = 'Message for room service (optional)';
  const header = document.querySelector('#panel-menu header');
  if (header && !document.getElementById('room-call')) {
    const b = document.createElement('button');
    b.id = 'room-call'; b.type = 'button'; b.className = 'room-call'; b.setAttribute('onclick', 'ringWaiter()');
    b.innerHTML = '<span class="rc-ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>' +
      '<span class="rc-txt"><span class="rc-main" id="room-call-label">' + CALL_TXT.idle + '</span><span class="rc-sub">Tap and we’ll come to your room</span></span>';
    header.insertAdjacentElement('afterend', b);
    if (!dining) b.insertAdjacentHTML('afterend', '<div class="room-note">Need towels, a cleaning, or anything else? Tap the button above and our team will be with you shortly.</div>');
  }
}

async function ringWaiter() {
  const btns = Array.from(document.querySelectorAll('#call-btn, #room-call'));
  const labels = Array.from(document.querySelectorAll('#call-btn-label, #room-call-label'));
  const label = document.getElementById('room-call-label') || document.getElementById('call-btn-label');
  const setAll = t => labels.forEach(l => { l.textContent = t; });
  btns.forEach(b => { b.disabled = true; });
  try {
    const loc = await withLocationStatus(label, () => getLocation());
    setAll('Sending…');
    const res = await fetch(`${API_BASE}/calls`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ qr_token: qrToken, customer_latitude: loc.lat, customer_longitude: loc.lng, accuracy_meters: loc.accuracy }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || 'Could not send call');
    const call = await res.json();
    setAll(CALL_TXT.sent);
    btns.forEach(b => b.classList.add('sent'));
    showToast(CALL_TXT.toast);
    addNotification(CALL_TXT.noteT, CALL_TXT.noteB);
    pollCallStatus(call.id);
    setTimeout(() => { btns.forEach(b => { b.disabled = false; b.classList.remove('sent'); }); setAll(CALL_TXT.idle); }, 20000);
  } catch (e) {
    btns.forEach(b => { b.disabled = false; });
    setAll(CALL_TXT.idle);
    showToast(e.message);
  }
}

let callStatusPollTimer = null;
function pollCallStatus(callId) {
  // On-screen only, not a real push — iOS Safari can't reliably deliver push
  // to a plain browser tab without a PWA install, so polling while the page
  // is open is what actually works here for every customer, not just some.
  clearInterval(callStatusPollTimer);
  let attempts = 0;
  const MAX_ATTEMPTS = 40; // ~120s at 3s/poll — comfortably past the round-robin's worst case
  callStatusPollTimer = setInterval(async () => {
    attempts++;
    if (attempts > MAX_ATTEMPTS) { clearInterval(callStatusPollTimer); return; }
    try {
      const res = await fetch(`${API_BASE}/calls/${callId}/status`);
      if (!res.ok) return;
      const call = await res.json();
      if (call.status === 'acknowledged') {
        clearInterval(callStatusPollTimer);
        const name = call.acknowledged_by_name;
        const msg = name ? `${name} is on the way!` : 'Someone is on the way!';
        showToast(msg);
        addNotification('On the way', msg);
      } else if (call.status === 'missed') {
        clearInterval(callStatusPollTimer);
        showToast('No one picked this up yet — please try again');
        addNotification('Still waiting', 'Nobody has responded yet — feel free to call again or wave someone down.');
      }
    } catch (e) { /* network hiccup — next poll retries */ }
  }, 3000);
}

async function fetchOrderHistory() {
  if (!qrToken) return;
  try {
    const res = await fetch(`${API_BASE}/order/${qrToken}/orders`);
    if (!res.ok) return; // non-fatal — just try again next poll
    orderHistory = await res.json();
    if (currentPanel === 0) renderOrderPanel(); // only redraw if this panel's actually visible right now
  } catch (e) { /* non-fatal — network hiccup, next poll will retry */ }
}

/* Placing an order feels instant: the moment the customer taps Confirm the cart clears,
   they're taken back to the menu, and the order appears under "Ordered so far" as
   "Sending…". The request itself runs in the background — waiting for a location fix and a
   slow server used to leave the button sitting there for seconds.

   Every attempt carries a token, so if the connection drops and it's retried, the server
   hands back the SAME order instead of creating a second one. If it truly can't be sent,
   the items go back into the cart with the reason — an order is never silently lost. */
function cartSignature(items, note) { return JSON.stringify([items.map(i => i.menu_item_id + '|' + (i.kind || '') + '|' + (i.size || '') + '|' + (i.temperature || '') + '|' + ((i.addons || []).slice().sort().join('+')) + 'x' + i.quantity).sort(), note || '']); }
function newOrderToken() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2)); }

async function postOrderOnce(payload) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 15000);   // a hung request must not block the retry
  try {
    const res = await fetch(`${API_BASE}/orders`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: ctl.signal,
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      const err = new Error(typeof data.detail === 'string' ? data.detail : 'Could not place order');
      err.status = res.status;
      throw err;
    }
    return res.json();
  } finally { clearTimeout(timer); }
}

async function sendOrderInBackground(entry) {
  const delays = [1000, 3000, 8000];
  try {
    const loc = await getLocation();   // usually already resolved — it's fetched when the page opens
    const payload = {
      qr_token: qrToken, customer_latitude: loc.lat, customer_longitude: loc.lng, accuracy_meters: loc.accuracy,
      items: entry.apiItems, note: entry.note || null, client_token: entry.token,
    };
    let order;
    for (let i = 0; ; i++) {
      try { order = await postOrderOnce(payload); break; }
      catch (e) {
        const retryable = !e.status || e.status >= 500;   // a dropped connection or a server hiccup — not "you're too far away"
        if (!retryable || i >= delays.length) throw e;
        await new Promise(r => setTimeout(r, delays[i]));
      }
    }
    try { rememberUsual(entry.apiItems); } catch (e) { /* optional */ }
    // Slot the confirmed order straight into the list (no gap, no flicker); the poll reconciles later.
    orderHistory = orderHistory.filter(o => o.id !== order.id).concat(order);
    pendingOrders = pendingOrders.filter(p => p !== entry);
    retryToken = null; retrySig = '';
    renderOrderPanel();
    fetchOrderHistory();
    const num = order.order_number != null ? order.order_number : order.id;
    document.getElementById('status-banner-slot').innerHTML = `<div class="status-banner">Order <b style="font-size:1.15em;">#${escapeHtml(String(num))}</b> placed — the cafe has it now. Keep this number handy.</div>`;
    addNotification(`Order #${num} placed`, 'The cafe has received your order — mention this number if you need to ask about it.');
  } catch (e) {
    // Couldn't send: hand the items back (merged with anything added meanwhile) so nothing is lost.
    pendingOrders = pendingOrders.filter(p => p !== entry);
    entry.lines.forEach(l => { const ex = cart[l.id]; if (ex) ex.quantity += l.quantity; else { const c = Object.assign({}, l); delete c.id; cart[l.id] = c; } });
    retryToken = entry.token; retrySig = entry.sig;   // re-confirming this same cart re-uses the token
    renderMenu(); renderCartBar(); renderOrderPanel();
    document.getElementById('status-banner-slot').innerHTML = '';
    showToast((e.message || 'Could not send your order') + ' — your items are back in your order.');
  }
}

function placeOrder() {
  const { count, total } = cartTotals();
  if (count === 0) return;
  const noteEl = document.getElementById('order-note');
  const note = noteEl.value.trim();
  const apiItems = Object.values(cart).map(c => Object.assign({ menu_item_id: c.menu_item_id, quantity: c.quantity },
    c.size ? { size: c.size } : {}, c.temperature ? { temperature: c.temperature } : {}, c.kind ? { kind: c.kind } : {}, (c.addons && c.addons.length) ? { addons: c.addons.map(a => a.name) } : {}));
  const lines = Object.entries(cart).map(([id, c]) => Object.assign({}, c, { id }));
  // Until the server stores size / hot-cold, also spell the choices out in the kitchen note.
  const choiceNote = '';   // the server stores every choice on its own order line now (it used to be copied into the note)
  const fullNote = [note, choiceNote].filter(Boolean).join(' — ');
  const sig = cartSignature(apiItems, fullNote);
  const entry = {
    token: (retryToken && sig === retrySig) ? retryToken : newOrderToken(), sig, apiItems, note: fullNote, lines,
    // shaped like a server order, so the "Ordered so far" list can draw it as-is
    total_amount: total, _sending: true, status: 'sending', created_at: new Date().toISOString(),
    items: lines.map(l => ({ name: l.name, quantity: l.quantity, price_at_order: l.price })),
  };
  pendingOrders.push(entry);
  cart = {};
  noteEl.value = '';
  renderMenu();
  renderCartBar();
  renderOrderPanel();
  goToPanel(1);                       // straight back to the menu
  document.getElementById('status-banner-slot').innerHTML = '<div class="status-banner">Sending your order…</div>';
  showToast('Order placed');
  sendOrderInBackground(entry);
}
window.addEventListener('beforeunload', e => { if (pendingOrders.length) { e.preventDefault(); e.returnValue = ''; } });

/* ==== Ask for the bill ====
   After the meal the guest taps "Ask for the bill" under "Ordered so far". That tells the cafe this
   table is done — the dashboard's Orders tab flags the table "Bill requested" and alerts staff.
   Backend: POST /order/{qr_token}/bill-request  → marks the table's open orders with bill_requested_at
   (the orders list returns that field, so the request survives a page reload). Until the backend has
   it, this falls back to the normal waiter call so staff are still pinged. */
function billKey() { return 'xyzzy-bill-' + qrToken; }
function billSig(list) { return list.map(o => o.id).sort().join(','); }
function renderBillAsk(list) {
  const host = document.getElementById('bill-ask');
  if (!host) return;
  const real = list.filter(o => !o._sending);
  if (!real.length) { host.innerHTML = ''; return; }
  let asked = real.every(o => o.bill_requested_at);
  if (!asked) { try { asked = sessionStorage.getItem(billKey()) === billSig(real); } catch (e) {} }
  const total = real.reduce((s, o) => s + (Number(o.total_amount) || 0), 0);
  if (asked) {
    host.innerHTML = '<div class="bill-ok"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><div><b>Bill requested</b>Your waiter is bringing it over. Total so far: ₹' + total + '</div></div>';
    return;
  }
  const sending = list.some(o => o._sending);
  host.innerHTML = '<button class="bill-btn" id="bill-btn" onclick="requestBill()"' + (sending ? ' disabled' : '') + '><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 .7V2z"/><path d="M8 7h8M8 11h8M8 15h5"/></svg><span id="bill-btn-label">Done eating? Ask for the bill · ₹' + total + '</span></button><div class="bill-hint">' + (sending ? 'Wait for your last order to go through first.' : 'Your waiter will bring it to the table.') + '</div>';
}
async function requestBill() {
  if (!orderHistory.some(o => !o._sending)) return;
  // Instant: the guest sees "Bill requested" the moment they tap; the request goes out in the background and is undone only if it fails.
  const before = orderHistory.map(o => o.bill_requested_at);
  const now = new Date().toISOString();
  orderHistory.forEach(o => { o.bill_requested_at = o.bill_requested_at || now; });
  try { sessionStorage.setItem(billKey(), billSig(orderHistory.filter(o => !o._sending))); } catch (e) {}
  showToast('Your bill is on its way');
  renderOrderPanel();
  try {
    let res = await fetch(`${API_BASE}/order/${qrToken}/bill-request`, { method: 'POST' });
    if (res.status === 404 || res.status === 405) {            // backend doesn't have bill requests yet → ring the waiter instead
      const loc = await getLocation();
      res = await fetch(`${API_BASE}/calls`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ qr_token: qrToken, customer_latitude: loc.lat, customer_longitude: loc.lng, accuracy_meters: loc.accuracy }),
      });
    }
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || 'Could not ask for the bill');
    addNotification('Bill requested', 'Your waiter has been told you\u2019re done and will bring the bill.');
  } catch (e) {
    orderHistory.forEach((o, i) => { o.bill_requested_at = before[i] || null; });
    try { sessionStorage.removeItem(billKey()); } catch (e2) {}
    showToast(typeof e.message === 'string' ? e.message : 'Could not ask for the bill');
    renderOrderPanel();
  }
}

function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }

initCarouselSwipe();
loadMenu();
getLocation(); // kicked off immediately, in parallel with the menu — usually resolved before anyone taps a button
</script>
