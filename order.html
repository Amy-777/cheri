<script>
(function categoryJumpMenu() {
  const btn = document.getElementById('catnav-btn');
  const panel = document.getElementById('catnav-panel');
  const backdrop = document.getElementById('catnav-backdrop');
  const icon = document.getElementById('catnav-icon');
  const label = document.getElementById('catnav-label');
  const ICON_MENU = '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>';
  const ICON_CLOSE = '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>';
  icon.innerHTML = ICON_MENU;
  let sections = [];   // [{ name, slug, count }]
  let isOpen = false;

  /* ---- colours: borrow them from the theme's own "Your Order" pill ---- */
  const isClear = c => !c || c === 'transparent' || /rgba\([^)]*,\s*0\)$/.test(c);
  const rgbOf = c => { const m = /rgba?\(([^)]+)\)/.exec(c || ''); return m ? m[1].split(',').slice(0, 3).map(v => parseFloat(v)) : null; };
  const lum = rgb => rgb ? (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) : 0;
  function solidBackground(el) {
    for (; el && el !== document.documentElement; el = el.parentElement) {
      const c = getComputedStyle(el).backgroundColor;
      if (!isClear(c)) return c;
    }
    return getComputedStyle(document.body).backgroundColor || 'rgb(255,255,255)';
  }
  function applyThemeColours() {
    const pill = document.getElementById('cart-btn') || document.getElementById('call-btn');
    if (!pill) return;
    const cs = getComputedStyle(pill);
    btn.style.background = 'none';
    btn.style.backgroundColor = cs.backgroundColor;
    if (cs.backgroundImage && cs.backgroundImage !== 'none') btn.style.backgroundImage = cs.backgroundImage;
    btn.style.color = cs.color;
    btn.style.borderColor = isClear(cs.borderTopColor) ? 'transparent' : cs.borderTopColor;
    btn.style.borderRadius = cs.borderTopLeftRadius;
    btn.style.fontFamily = cs.fontFamily;
    if (cs.boxShadow && cs.boxShadow !== 'none') btn.style.boxShadow = cs.boxShadow;
    // If the pill itself is see-through (glassy themes), fall back to the page colour so the button stays readable.
    if (isClear(cs.backgroundColor) && (!cs.backgroundImage || cs.backgroundImage === 'none')) {
      btn.style.backgroundColor = solidBackground(pill.parentElement);
    }
    // Panel: the theme's own card surface (--paper) and text colour (--ink), read straight from the
    // theme. (Reading the page's background doesn't work on the animated themes — it's see-through
    // there, which used to turn the panel black with dark text on it.)
    const rootCss = getComputedStyle(document.documentElement);
    const tok = name => rootCss.getPropertyValue(name).trim();
    const toRgb = c => { c = (c || '').trim(); const h = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c);
      if (h) { let x = h[1]; if (x.length === 3) x = x.split('').map(ch => ch + ch).join(''); return [0, 2, 4].map(i => parseInt(x.substr(i, 2), 16)); }
      const m = rgbOf(c); return m && !isClear(c) ? m : null; };
    const menuPanel = document.getElementById('panel-menu') || document.body;
    const bg = toRgb(tok('--paper')) || toRgb(tok('--cream')) || rgbOf(solidBackground(menuPanel)) || [255, 255, 255];
    let text = tok('--ink') || getComputedStyle(menuPanel).color;
    if (Math.abs(lum(toRgb(text)) - lum(bg)) < 90) text = lum(bg) > 140 ? '#1A1D24' : '#F5F2EA';   // never dark-on-dark
    panel.style.background = `rgba(${bg.map(Math.round).join(',')}, .95)`;
    panel.style.color = text;
    panel.style.border = `1px solid ${tok('--glass-line') || tok('--border') || 'rgba(127,127,127,.25)'}`;
    panel.style.fontFamily = tok('--font-body') || getComputedStyle(menuPanel).fontFamily;
    // Highlight for the section you're in: the theme's price / accent colour, whichever reads on the panel.
    let accent = [tok('--olive-dark'), tok('--terracotta'), tok('--olive'), isClear(cs.backgroundColor) ? cs.color : cs.backgroundColor]

  /* ---- position: just above the bottom bar, lined up with its left edge ---- */
  function place() {
    const bar = document.querySelector('.bottom-bar');
    const r = bar ? bar.getBoundingClientRect() : null;
    const left = r && r.width ? Math.max(12, r.left + 4) : 16;
    const bottom = r && r.height ? Math.max(16, window.innerHeight - r.top + 12) : 96;
    btn.style.left = left + 'px'; btn.style.bottom = bottom + 'px';
    panel.style.left = left + 'px'; panel.style.bottom = (bottom + btn.offsetHeight + 10) + 'px';

  /* ---- which sections exist, and how many items each has (read from the rendered menu) ---- */
  function readSections() {
    sections = [...document.querySelectorAll('#menu-wrap .category-block, #menu-wrap .menu-section')].map(block => {
      const isSec = block.classList.contains('menu-section');
      return {

        name: (block.querySelector(isSec ? '.menu-section-title' : '.category-title') || {}).textContent || '',

  function updateVisibility() {
    const flipper = document.getElementById('flipper');
    const show = !!(flipper && flipper.classList.contains('settled')) &&
      typeof currentPanel !== 'undefined' && currentPanel === 1 &&
      !searchQuery && sections.length >= 2;

  function open() {
    if (isOpen) return;

  function close() {
    if (!isOpen) return;

    panel.classList.remove('open'); backdrop.classList.remove('open');

  btn.addEventListener('click', () => (isOpen ? close() : open()));

    const row = e.target.closest('.catnav-row');
    if (!row) return;

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen) { close(); btn.focus(); } });

  /* ---- keep in step with the page: re-read sections after each menu render, re-check on panel changes ---- */
  const origRenderCategoryBar = window.renderCategoryBar;
  window.renderCategoryBar = function (names) {
    const r = origRenderCategoryBar.apply(this, arguments);
    readSections(); applyThemeColours(); updateVisibility();
    return r;
  };
  const origGoToPanel = window.goToPanel;
  window.goToPanel = function () { const r = origGoToPanel.apply(this, arguments); updateVisibility(); return r; };
  window.addEventListener('resize', () => { if (!btn.hidden) place(); });
  // The cover flip and the theme's stylesheet both finish on their own clocks — re-check a few times, then settle.
  const flipper = document.getElementById('flipper');
  if (flipper) new MutationObserver(() => { applyThemeColours(); updateVisibility(); }).observe(flipper, { attributes: true, attributeFilter: ['class'] });
  const skin = document.getElementById('template-skin-css');
  if (skin) skin.addEventListener('load', () => { applyThemeColours(); if (!btn.hidden) place(); });
  setInterval(updateVisibility, 700);   // cheap: catches swipes between panels and search changes
})();
</script>

      </button>

    <div id="fb-body"></div>
  </div>

<script>
const Feedback = (function () {
  const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.3l-5.8 3.1 1.2-6.5L2.6 9.4l6.5-.8z"/></svg>';
  const MOODS = ['', 'Poor', 'Not great', 'Okay', 'Good', 'Loved it!'];
  const GOOD = ['Food', 'Service', 'Ambience', 'Value for money', 'Quick service', 'Cleanliness'];
  const BAD = ['Food', 'Slow service', 'Staff behaviour', 'Prices', 'Cleanliness', 'Noise'];
  let rating = 0, tags = new Set(), sending = false;
  const key = () => 'xyzzy-fb-' + (qrToken || 'demo') + '-' + new Date().toDateString();   // one review per table per day
  const done = () => { try { return JSON.parse(localStorage.getItem(key()) || 'null'); } catch (_) { return null; } };
  const cafeName = () => (typeof cafeInfo !== 'undefined' && cafeInfo && cafeInfo.name) || 'us';
  const googleUrl = () => (typeof cafeInfo !== 'undefined' && cafeInfo && /^https:\/\//.test(cafeInfo.google_review_url || '')) ? cafeInfo.google_review_url : '';
  const stars = (n, cls) => [1, 2, 3, 4, 5].map(i => `<button type="button" class="fb-star ${i <= n ? 'on' : ''}" data-star="${i}" aria-label="${i} star${i > 1 ? 's' : ''}" aria-pressed="${i <= n}">${STAR}</button>`).join('');

  /* ---- the small "Rate your visit" cards (end of the menu, and Your Order) ---- */
  function cardHtml() {
    const d = done();
    if (d) return `<div class="fb-card"><h3>Thanks for the review!</h3><p>You rated your visit</p><div class="fb-done-stars" aria-label="${d.rating} out of 5">${'★'.repeat(d.rating)}${'☆'.repeat(5 - d.rating)}</div></div>`;
    return `<div class="fb-card"><h3>Enjoying ${escapeHtml(cafeName())}?</h3><p>Tap the stars to rate your visit</p><div class="fb-stars" role="group" aria-label="Rate your visit">${stars(0)}</div></div>`;
  }
  function renderCards() {
    ['fb-menu-slot', 'fb-order-slot'].forEach(id => { const el = document.getElementById(id); if (el) el.innerHTML = cardHtml(); });
  }
  document.addEventListener('click', e => {
    const s = e.target.closest('.fb-card [data-star]');
    if (s) { open(Number(s.dataset.star)); }
  });

  /* ---- the sheet ---- */
  function render() {
    const body = document.getElementById('fb-body');
    const d = done();
    if (d) {
      const g = googleUrl();
      body.innerHTML = `<div class="fb-thanks"><div class="fb-done-stars" style="font-size:26px;">${'★'.repeat(d.rating)}${'☆'.repeat(5 - d.rating)}</div>
        <div class="fb-big">Thank you!</div>
        <p>${d.rating >= 4 ? `So glad you enjoyed it — the team at ${escapeHtml(cafeName())} will love reading this.` : `Sorry it wasn’t perfect. ${escapeHtml(cafeName())} will see your feedback and work on it.`}</p>
        ${d.rating >= 4 && g ? `<a class="fb-google" href="${g}" target="_blank" rel="noopener">Share it on Google too</a>` : ''}</div>`;
      return;
    }
    const list = rating && rating <= 3 ? BAD : GOOD;
    body.innerHTML = `
      <div class="fb-stars" role="group" aria-label="Your rating">${stars(rating)}</div>
      <div class="fb-mood" aria-live="polite">${MOODS[rating] || 'Tap a star'}</div>
      ${rating ? `<div class="fb-q">${rating <= 3 ? 'What could be better?' : 'What did you love?'}</div>
      <div class="fb-tags">${list.map(t => `<button type="button" class="fb-tag" data-tag="${escapeHtml(t)}" aria-pressed="${tags.has(t)}">${escapeHtml(t)}</button>`).join('')}</div>
      <textarea class="fb-input" id="fb-comment" rows="3" maxlength="600" placeholder="${rating <= 3 ? 'Tell us what went wrong — it really helps' : 'Anything you’d like to tell the team? (optional)'}">${escapeHtml(body._comment || '')}</textarea>
      <input class="fb-input" id="fb-name" maxlength="60" placeholder="Your name (optional)" value="${escapeHtml(body._name || '')}" autocomplete="given-name">
      <button class="place-order-btn fb-send" id="fb-send">Send review</button>` : ''}`;

  function popStar(n) {

    if (b) { b.classList.add('pop'); setTimeout(() => b.classList.remove('pop'), 200); }
  }
  const body = () => document.getElementById('fb-body');
  document.getElementById('fb-body').addEventListener('input', e => {
    if (e.target.id === 'fb-comment') body()._comment = e.target.value;
    if (e.target.id === 'fb-name') body()._name = e.target.value;
  });
  document.getElementById('fb-body').addEventListener('click', async e => {
    const s = e.target.closest('[data-star]');
    if (s) {
      const was = rating;
      rating = Number(s.dataset.star);
      if ((was <= 3) !== (rating <= 3)) tags = new Set();   // switched between "loved" and "could be better"
      render(); popStar(rating); return;
    }
    const t = e.target.closest('[data-tag]');
    if (t) { const v = t.dataset.tag; tags.has(v) ? tags.delete(v) : tags.add(v); t.setAttribute('aria-pressed', tags.has(v)); return; }
    if (e.target.closest('#fb-send')) send();
  });

  async function send() {
    if (sending || !rating) return;
    const btn = document.getElementById('fb-send');
    sending = true; btn.disabled = true; btn.textContent = 'Sending…';
    const payload = {
      rating, tags: [...tags],
      comment: (document.getElementById('fb-comment').value || '').trim() || null,
      name: (document.getElementById('fb-name').value || '').trim() || null,
    };
    try {
      const res = await fetch(`${API_BASE}/order/${encodeURIComponent(qrToken)}/feedback`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error(res.status === 404 || res.status === 405 ? 'Reviews aren’t switched on here yet' : 'Couldn’t send — please try again');
      try { localStorage.setItem(key(), JSON.stringify({ rating, at: Date.now() })); } catch (_) {}
      render(); renderCards();
      if (typeof addNotification === 'function') addNotification('Review sent', 'Thanks for rating your visit!');
    } catch (err) {
      showToast(err.message === 'Failed to fetch' ? 'No connection — please try again' : err.message);
      btn.disabled = false; btn.textContent = 'Send review';
    } finally { sending = false; }
  }

  function open(startRating) {
    if (!done()) { if (startRating) rating = startRating; }
    render();
    document.getElementById('fb-backdrop').classList.add('show');
    if (startRating) setTimeout(() => popStar(startRating), 60);
  }
  function close() { document.getElementById('fb-backdrop').classList.remove('show'); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('fb-backdrop').classList.contains('show')) close(); });

  // Draw the cards once the menu is on screen (cafe name known).
  const wait = setInterval(() => { if (typeof cafeInfo !== 'undefined' && cafeInfo) { clearInterval(wait); renderCards(); } }, 300);
  return { open, close, renderCards };
})();
</script>
<!-- ==== Live weather on the menu ====
     The menu mirrors the sky outside the cafe: rain streaks behind the cards when it's
     raining (heavier in a downpour, slanted by the wind), lightning flashes in a
     thunderstorm, snow, or a drifting haze in fog — on top of whatever template the cafe
     uses — plus a small "Raining outside · 26°" chip under the cafe name.
     Weather comes from Open-Meteo (free, no key) for the cafe's location, refreshed every
     15 minutes. Location: the cafe's own latitude/longitude if the menu data includes them,
     otherwise the guest's location only if they've ALREADY allowed it (never asks just for

<style>

    color: var(--ink); background: var(--glass, rgba(255,255,255,.6)); border: 1px solid var(--glass-line, var(--border)); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

<script>
const LiveWeather = (function () {

    storm: '<path d="M7 14a4 4 0 1 1 .9-7.9A5 5 0 0 1 17.6 8 3.5 3.5 0 0 1 17 15"/><path d="M12 13l-2 4h3l-2 4"/>',
    snow: '<path d="M7 14a4 4 0 1 1 .9-7.9A5 5 0 0 1 17.6 8 3.5 3.5 0 0 1 17 15H7Z"/><path d="M9 19h.01M12 21h.01M15 19h.01"/>',
    fog: '<path d="M4 9h16M3 13h18M5 17h14"/>',

  /* ---- where & what ---- */

    }

    el.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon}</svg>${kind === 'clear' && !isDay ? 'Clear night outside' : LABEL[kind]}${temp != null ? ` · ${Math.round(temp)}°` : ''}`;

  }

  /* ---- drawing ---- */
  let _light = null;
  function lightPage() {
    if (_light !== null) return _light;
    const c = (getComputedStyle(document.documentElement).getPropertyValue('--cream') || '').trim();
    const m = /^#([0-9a-f]{6})$/i.exec(c);
    if (!m) return (_light = true);

      for (let i = 0; i < n; i++) parts.push({ x: Math.random() * W, y: Math.random() * H, len: (kind === 'drizzle' ? 6 : 12) + Math.random() * (kind === 'drizzle' ? 6 : 16), v: (kind === 'drizzle' ? 380 : 700) + Math.random() * 500, a: .18 + Math.random() * .32 });
    } else if (kind === 'snow') {

    if (!animate) return;

  async function update(first) {
    try {
      const w = await fetchWeather();

      const [k, i] = classify(w.code);
      const changed = k !== kind || i !== intensity;

  }

    if (typeof cafeInfo !== 'undefined' && cafeInfo) { clearInterval(wait); update(true); setInterval(() => update(false), 15 * 60000); }
  }, 400);
  return { refresh: () => update(false) };
})();
</script>
<!-- ==== Secret menu ====

<script>
// "Cold Coffee" → "C*** ******": first character shown, every other letter masked, spaces kept.
function maskName(name) {
  const chars = Array.from(String(name || ''));
  return chars.map((ch, i) => (i === 0 || /\s/.test(ch)) ? ch : '*').join('');
}
const SecretMenu = (function () {
  const EYE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
  let on = false, pull = null, wheelAcc = 0, wheelT = 0;
  const items = () => (typeof menu !== 'undefined' && Array.isArray(menu) ? menu : []).filter(i => i.is_secret && i.is_available !== false);
  // The cafe can rename the secret menu in the dashboard (cafe.secret_menu_name); blank = "Secret menu".
  const custom = () => (typeof cafeInfo !== 'undefined' && cafeInfo && String(cafeInfo.secret_menu_name || '').trim()) || '';
  const title = () => custom() || 'Secret menu';
  const ready = () => {
    const f = document.getElementById('flipper');
    const sheetOpen = document.querySelector('.sheet-backdrop.show, .jb-backdrop.open, .catnav-panel.open');
    return items().length && f && f.classList.contains('settled') && typeof currentPanel !== 'undefined' && currentPanel === 1 && !sheetOpen;
  };

  // ---- the bits on the page ----
  document.body.insertAdjacentHTML('beforeend',
    '<div class="sm-pull" id="sm-pull" aria-hidden="true"><span class="sm-eye-ring"><span>' + EYE + '</span></span><span id="sm-pull-text">Keep pulling…</span></div>' +
    '<div class="sm-veil" id="sm-veil" aria-hidden="true"></div>');
  const veil = document.getElementById('sm-veil');
  for (let i = 0; i < 14; i++) {   // vanish-mode bubbles drifting up through the dark
    const b = document.createElement('i'); const sz = 6 + Math.random() * 22;
    b.style.cssText = `left:${Math.random() * 100}%;width:${sz}px;height:${sz}px;animation-duration:${7 + Math.random() * 9}s;animation-delay:-${Math.random() * 12}s`;
    veil.appendChild(b);
  }
  function mount() {
    const center = document.querySelector('.header-center');
    if (center && !document.getElementById('sm-title')) center.insertAdjacentHTML('afterbegin', '<div class="sm-title" id="sm-title" aria-hidden="true"></div>');
    const st = document.getElementById('sm-title'); if (st) st.textContent = title();
    const after = document.getElementById('menu-wrap');

  }

  function render() {
    const wrap = document.getElementById('secret-wrap'); if (!wrap) return;
    const all = items(), allOpen = all.length && all.every(i => i.secret_visible);
    const smt = document.getElementById('sm-title'); if (smt) smt.textContent = title();
    wrap.innerHTML = `<p class="sm-hint">${allOpen ? (custom() ? 'Shh. Welcome to ' + escapeHtml(custom()) + '.' : 'Shh. Welcome to the secret menu.') : 'Shh. Hold the eye to see what it is — let go and it hides again.'}</p>` + all.map((item, idx) => {
      const qty = itemQtyInCart(item.id);
      return `<div class="sm-item menu-item" id="mi-row-${item.id}" style="--i:${idx}">
        <div class="mi-info">
          <div class="sm-name-row"><span class="sm-name${item.secret_visible ? ' revealed' : ''}" data-sid="${item.id}">${escapeHtml(item.secret_visible ? item.name : maskName(item.name))}</span></div>
          <span class="sm-price">₹${item.price}</span>
        </div>
        <div class="qty-control">${qtyControlHtml(item, qty)}</div>

  }

  // ---- hold the eye to peek ----

    const item = items().find(i => i.id === id);
    const el = document.querySelector(`.sm-name[data-sid="${id}"]`), btn = document.querySelector(`.sm-eye[data-peek="${id}"]`);
    if (!item || !el || item.secret_visible) return;     // the cafe chose to show this name openly

    } else apply(to);
  }

  // ---- tap the cafe's name to open (or leave) it ----
  const nameEl = document.getElementById('cafe-name');
  let lastTap = 0;
  if (nameEl) nameEl.addEventListener('click', () => {
    if (!on && !ready()) return;                              // only cafes with secret items, once the menu is showing
    const now = Date.now(); if (now - lastTap < 900) return; lastTap = now;
    const r = nameEl.getBoundingClientRect();

  }

  // Turn the gesture on once the menu is loaded — and only if this cafe has secret items.
  const wait = setInterval(() => {
    if (typeof cafeInfo !== 'undefined' && cafeInfo && typeof menu !== 'undefined') {
      clearInterval(wait);
      if (items().length) { document.documentElement.classList.add('sm-ready'); mount(); }
    }
  }, 400);
  return { toggle, render };
})();
